name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commitlint:
    name: Commit messages follow Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: npm install --no-save @commitlint/cli@19 @commitlint/config-conventional@19
      - name: Validate PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx commitlint --extends '@commitlint/config-conventional'
      - name: Validate commits in PR
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx commitlint --extends '@commitlint/config-conventional' --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  dco-check:
    name: All commits signed off (DCO)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify Signed-off-by on each commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -e
          missing=$(git log --format='%H %s' "${BASE_SHA}..${HEAD_SHA}" | while read -r sha rest; do
            if ! git log -1 --format=%B "$sha" | grep -q '^Signed-off-by: '; then
              echo "$sha"
            fi
          done)
          if [ -n "$missing" ]; then
            echo "::error::The following commits are missing a Signed-off-by line:"
            echo "$missing"
            exit 1
          fi

  lint:
    name: Lint action.yml, scripts, and example workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run actionlint on workflows and action.yml
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

      - name: shellcheck scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh

      - name: Policy report renders a violation line (fixture)
        env:
          KUBEATLAS_POLICY_REPORT_JSON: test/fixtures/diagnose-violations.json
          KUBEATLAS_ACTION_SCOPE: cluster
          KUBEATLAS_POLICY_REPORT_OUTPUT: policy-report.md
        run: |
          scripts/policy-report.sh
          cat policy-report.md
          # Two violations from the fixture must render as table rows.
          grep -q '/K8sRequiredLabels/must-have-owner | petclinic/Deployment/api' policy-report.md
          grep -q '2 policy violation' policy-report.md

      - name: Policy report rejects invalid diagnose output
        env:
          KUBEATLAS_POLICY_REPORT_JSON: /dev/null
          KUBEATLAS_ACTION_SCOPE: cluster
          KUBEATLAS_POLICY_REPORT_OUTPUT: /tmp/invalid-policy-report.md
        run: |
          if scripts/policy-report.sh; then
            echo "::error::policy report accepted invalid diagnose JSON"
            exit 1
          fi

  smoke:
    name: Smoke test against kind
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - name: Set up kind cluster
        uses: helm/kind-action@v1

      - name: Apply a tiny fixture
        run: |
          kubectl create namespace demo
          kubectl create deployment hello -n demo --image=nginx:alpine
          kubectl rollout status deploy/hello -n demo --timeout=120s

      - name: Prepare isolated download temporary directory
        run: mkdir -p "${{ runner.temp }}/kubeatlas-action-downloads"

      - name: Run the action against the kind cluster
        id: kubeatlas
        uses: ./
        env:
          # Keep mktemp output isolated so the next step can assert
          # that both download paths clean up after themselves.
          TMPDIR: ${{ runner.temp }}/kubeatlas-action-downloads
        with:
          # Pin the real published asset exercised by this regression
          # test. The moving "latest" release must not change the
          # behaviour under test between otherwise identical runs.
          version: v1.5.2
          scope: namespace:demo
          output: artifacts/demo.svg
          policy-report: 'true'

      - name: Verify the SVG was produced
        run: |
          test -s artifacts/demo.svg
          # Match anywhere in the file — graphviz prepends an XML
          # declaration + DOCTYPE + Generated-by comment before the
          # <svg> tag, so a fixed-byte head was too tight.
          grep -q '<svg' artifacts/demo.svg

      - name: Verify the policy report was produced
        env:
          REPORT: ${{ steps.kubeatlas.outputs.policy-report-path }}
        run: |
          # The live path proves the wiring end to end: it downloads and
          # verifies the kubeatlas CLI, runs `diagnose` against the kind
          # cluster, and renders Markdown. kind has no policy engine, so
          # the body is "no violations" (or, on a pre-v1.4 CLI, the
          # version note) — either way the file must exist and be headed.
          test -n "${REPORT}"
          test -s "${REPORT}"
          grep -q 'KubeAtlas policy report' "${REPORT}"

      - name: Verify download temporary directories were removed
        env:
          TMPDIR: ${{ runner.temp }}/kubeatlas-action-downloads
        run: |
          if find "${TMPDIR}" -mindepth 1 -maxdepth 1 -print -quit | grep -q .; then
            echo "::error::download temporary directory was not cleaned up"
            find "${TMPDIR}" -mindepth 1 -maxdepth 1 -print
            exit 1
          fi

      - name: Upload SVG for inspection
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kubeatlas-demo-svg
          path: artifacts/demo.svg
          retention-days: 7
